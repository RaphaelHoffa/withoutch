apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-db
  namespace: default
  labels:
    app: todo
    component: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
      component: db
  template:
    metadata:
      labels:
        app: todo
        component: db
    spec:
      containers:
        - name: db
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: todos
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secrets
                  key: db-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: todo-db
  namespace: default
spec:
  selector:
    app: todo
    component: db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
